<mat-form-field>
  <mat-label>تاریخ</mat-label>
  <input matInput [matDatepicker]="picker"  placeholder="تاریخ را انتخاب کنید">
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>تاریخ</mat-label>
  <input matInput [matDatepicker]="picker" [matDatepickerStartAt]="startDate" [formControl]="control" placeholder="تاریخ را انتخاب کنید">
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>
